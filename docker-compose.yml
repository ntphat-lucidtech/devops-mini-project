version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: devops-postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devops-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-backend-api
    restart: always
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - DB_HOST=database
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - devops-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops-frontend-app
    restart: always
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - BACKEND_API_URL=http://localhost:${BACKEND_PORT}
    depends_on:
      - backend
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
