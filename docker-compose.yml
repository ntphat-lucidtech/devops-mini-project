version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: devops-postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devops_db}
      POSTGRES_USER: ${POSTGRES_USER:-devops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretPassword123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-CHELL", "pg_isready -U {${POSTGRES_USER:-devops_admin} -d ${POSTGRES_DB:-devops_db}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - devops-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-backend-api
    restart: always
    ports:
      - "5000:8080"
    environment:
      - DB_HOST=database
      - POSTGRES_USER=devops_admin
      - POSTGRES_PASSWORD=SuperSecretPassword123!
      - POSTGRES_DB=devops_db
    depends_on: 
      database:
        condition: service_healthy
    networks:
      - devops-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops-frontend-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge
volumes:
  postgres_data:
    driver: local
